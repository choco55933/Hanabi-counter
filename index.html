<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Hanabi カードカウンター</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>Hanabi カードカウンター</h1>
    <div class="board" id="board"></div>
    <button id="reset">リセット</button>

    <script>
      const colors = [
        { name: "赤", class: "red" },
        { name: "青", class: "blue" },
        { name: "緑", class: "green" },
        { name: "黄", class: "yellow" },
        { name: "白", class: "white" },
      ];

      const initialCounts = { 1: 3, 2: 2, 3: 2, 4: 2, 5: 1 };

      const board = document.getElementById("board");
      let currentCounts = {};

      function createCard(colorObj, number, count) {
        const color = colorObj.name;
        const colorClass = colorObj.class;
        const id = `${color}-${number}`;

        const div = document.createElement("div");
        div.className = `card ${colorClass}`;
        div.innerHTML = `
    <div class="color-name">${color}</div>
    <div class="number">${number}</div>
    <div class="count" id="${id}">${count}</div>
    <div class="controls">
      <button onclick="changeCount('${color}', ${number}, -1)">−</button>
      <button onclick="changeCount('${color}', ${number}, 1)">＋</button>
    </div>
  `;
        board.appendChild(div);
        currentCounts[id] = count;
      }

      function renderBoard() {
        board.innerHTML = "";
        colors.forEach((colorObj) => {
          for (let n = 1; n <= 5; n++) {
            createCard(colorObj, n, initialCounts[n]);
          }
        });
      }
      renderBoard();

      function changeCount(color, number, delta) {
        const id = `${color}-${number}`;
        const el = document.getElementById(id);
        let current = currentCounts[id];
        const max = initialCounts[number];

        current = Math.min(max, Math.max(0, current + delta));
        currentCounts[id] = current;

        el.textContent = current;
        el.classList.toggle("zero", current === 0);
      }

      document.getElementById("reset").addEventListener("click", () => {
        renderBoard();
      });
    </script>
  </body>
</html>
